name: Collective Medical
description: 'Collective Medical is a full-continuum, real-time care collaboration
  network for healthcare, connecting hospitals, health systems, post-acute providers,
  health plans, and payers so care teams can coordinate around complex, high-risk,
  and vulnerable patients across the entire patient journey. Founded in Utah and backed
  by Bessemer Venture Partners and Kleiner Perkins, the platform is known for its
  real-time event notifications, ADT-based care-coordination alerts, and shared
  clinical insights used by emergency departments and care-management teams. Collective
  Medical was acquired by PointClickCare in 2020 and is now fully integrated into
  PointClickCare; its former developer, login, support, and legal surfaces are served
  through PointClickCare properties (developer.pointclickcare.com and pointclickcare.com).
  This profile tracks the Collective Medical brand within the API Evangelist network.'
